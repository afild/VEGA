  <text x="76" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="96" fill="url(#text-gradient)" font-weight="800" letter-spacing="-2">VEGA</text>
  
  <text x="80" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#94a3b8" font-weight="400">PDF contract ingestion, critical clause extraction,</text>
  <text x="80" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#94a3b8" font-weight="400">risk health scoring, and 90-day alert timelines.</text>

  <g transform="translate(680, 80)">
    <rect width="420" height="240" fill="#0f172a" fill-opacity="0.8" rx="12" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
    <rect width="420" height="40" fill="#ffffff" fill-opacity="0.05" rx="12" stroke="none"/>
    <circle cx="20" cy="20" r="5" fill="#ef4444"/>
    <circle cx="40" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="20" r="5" fill="#10b981"/>
    <text x="84" y="25" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#94a3b8">vega_contracts.db / JSON Output</text>
    
    <text x="24" y="76" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" fill="#10b981">{</text>
    <text x="44" y="104" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" fill="#38bdf8">"contract_type"</text>
    <text x="180" y="104" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" fill="#94a3b8">:</text>
    <text x="200" y="104" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" fill="#a3e635">"SaaS Subscription"</text>
    <text x="360" y="104" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" fill="#94a3b8">,</text>

    <text x="44" y="132" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" fill="#38bdf8">"health_score"</text>
    <text x="180" y="132" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" fill="#94a3b8">:</text>
    <text x="200" y="132" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" fill="#fbbf24">82</text>
    <text x="220" y="132" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" fill="#94a3b8">,</text>

    <text x="44" y="160" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" fill="#38bdf8">"liability_cap"</text>
    <text x="180" y="160" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" fill="#94a3b8">:</text>
    <text x="200" y="160" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" fill="#a3e635">"12 months fees"</text>
    <text x="350" y="160" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" fill="#94a3b8">,</text>

    <text x="44" y="188" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" fill="#38bdf8">"auto_renewal"</text>
    <text x="180" y="188" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" fill="#94a3b8">:</text>
    <text x="200" y="188" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" fill="#f87171">true</text>
    <text x="240" y="188" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" fill="#94a3b8">,</text>

    <text x="44" y="216" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" fill="#38bdf8">"notice_period"</text>
    <text x="180" y="216" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" fill="#94a3b8">:</text>
    <text x="200" y="216" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" fill="#fbbf24">"90 days"</text>
    <text x="24" y="244" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" fill="#10b981">}</text>
  </g>
